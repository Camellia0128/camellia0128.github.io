<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathMind - 智能数学复习工作台 (Pro最终版)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- KaTeX for rendering Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Tesseract.js for OCR -->
    <script src='https://unpkg.com/tesseract.js@5.0.5/dist/tesseract.min.js'></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        .math-font { font-family: 'Times New Roman', serif; }
        .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
        
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s ease infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Chat Styles */
        .chat-bubble { position: relative; max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
        .chat-user { background-color: #eff6ff; color: #1e3a8a; border-bottom-right-radius: 2px; margin-left: auto; }
        .chat-ai { background-color: #f3f4f6; color: #1f2937; border-bottom-left-radius: 2px; margin-right: auto; }
        
        /* Flashcard 3D Flip */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Drag Overlay */
        .drag-overlay {
            background-image: repeating-linear-gradient(45deg, #e0f2fe 0, #e0f2fe 10px, #eff6ff 10px, #eff6ff 20px);
        }

        /* Graph Node Animations */
        .node-circle { transition: all 0.3s ease; cursor: pointer; }
        .node-circle:hover { r: 25; stroke: #3b82f6; stroke-width: 3px; fill: #dbeafe; }
        .link-line { stroke: #cbd5e1; stroke-width: 2px; transition: all 0.3s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- Icons (保持不变) ---
        const ICONS = {
            'layers': <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
            'download': <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
            'settings': <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
            'brain-circuit': <><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.97-3.418"/><path d="M8 22v-2a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M18 22v-4a2 2 0 0 0-2-2h-4"/><path d="M15 9a3 3 0 1 0 5.997.129 4 4 0 0 0 2.526 5.77 4 4 0 0 0-.556 6.588A4 4 0 1 0 15 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4"/><path d="M17.997 5.129a3 3 0 0 1-.398 1.375"/><path d="M20.523 10.896a4 4 0 0 0-.585-.396"/><path d="M18 18a4 4 0 0 0 1.97-3.418"/></>,
            'upload-cloud': <><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></>,
            'sparkles': <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5h4"/><path d="M19 19v4"/><path d="M15 21h4"/></>,
            'library': <><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></>,
            'share-2': <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></>,
            'graduation-cap': <><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></>,
            'folder-open': <><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-3.25 7a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></>,
            'check-circle-2': <><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>,
            'circle-dashed': <><path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 2.182a10 10 0 0 1 3.8 1.1"/><path d="M17.7 3.282a10 10 0 0 1 2.8 2.3"/><path d="M20.5 5.582a10 10 0 0 1 1.7 3.3"/><path d="M22.2 8.882a10 10 0 0 1 0 2.2"/><path d="M22.2 11.082a10 10 0 0 1-1.7 3.3"/><path d="M20.5 14.382a10 10 0 0 1-2.8 2.3"/><path d="M17.7 16.682a10 10 0 0 1-3.8 1.1"/><path d="M13.9 17.782a10 10 0 0 1-3.8 0"/><path d="M10.1 17.782a10 10 0 0 1-3.8-1.1"/><path d="M6.3 16.682a10 10 0 0 1-2.8-2.3"/><path d="M3.5 14.382a10 10 0 0 1-1.7-3.3"/><path d="M1.8 11.082a10 10 0 0 1 0-2.2"/><path d="M1.8 8.882a10 10 0 0 1 1.7-3.3"/><path d="M3.5 5.582a10 10 0 0 1 2.8-2.3"/><path d="M6.3 3.282a10 10 0 0 1 3.8-1.1"/></>,
            'refresh-cw': <><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>,
            'pen-tool': <><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></>,
            'plus-circle': <><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></>,
            'chevron-down': <><path d="m6 9 6 6 6-6"/></>,
            'arrow-left': <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
            'arrow-right': <><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
            'x': <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
            'align-left': <><line x1="21" y1="6" x2="3" y2="6"/><line x1="15" y1="12" x2="3" y2="12"/><line x1="17" y1="18" x2="3" y2="18"/></>,
            'lightbulb': <><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></>,
            'wand-2': <><path d="m19 2 2 2-2 2-2-2 2-2Z"/><path d="m5 17 2 2-2 2-2-2 2-2Z"/><path d="m2 2 2 2-2 2-2-2 2-2Z"/><path d="m9 9 5 5"/></>,
            'eye': <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>,
            'eye-off': <><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></>,
            'message-circle': <><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></>,
            'send': <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
            'trophy': <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>,
            'rotate-cw': <><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></>,
            'flip-horizontal': <><path d="M8 8a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2"/><path d="M4 8V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></>,
            'check': <><polyline points="20 6 9 17 4 12"/></>,
            'rotate-ccw': <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
            'alert-triangle': <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
            'pencil': <><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></>,
            'book-open': <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
            'import': <><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></>,
        };

        const Icon = ({ name, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {ICONS[name] || null}
            </svg>
        );

        // --- Math Renderer ---
        const MathRenderer = ({ content }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.renderMathInElement && containerRef.current) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            }, [content]);
            return <div ref={containerRef} className="prose prose-sm max-w-none text-gray-800 math-font whitespace-pre-wrap leading-relaxed break-words">{content}</div>;
        };

        // --- Sub-Components (Moved Outside App to fix re-render issues) ---
        
        const FlashcardModal = ({ show, queue, retryQueue, round, currentIndex, isFlipped, setIsFlipped, onClose, onResult, onRetry }) => {
            if (!show) return null;
            const isFinished = currentIndex >= queue.length;
            const current = !isFinished ? queue[currentIndex] : null;
            return (
                <div className="fixed inset-0 bg-gray-900/95 z-[60] flex flex-col items-center justify-center p-4 animate-in fade-in">
                    <div className="w-full max-w-3xl flex justify-between items-center mb-6 text-white">
                        <h2 className="text-2xl font-bold flex items-center gap-2"><Icon name="layers" className="w-6 h-6"/> {isFinished ? '复习总结' : `第 ${round} 轮复习 (${currentIndex + 1}/${queue.length})`}</h2>
                        <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full"><Icon name="x" className="w-8 h-8"/></button>
                    </div>
                    {isFinished ? (
                        <div className="bg-white rounded-2xl p-8 max-w-lg w-full text-center animate-in zoom-in">
                            {retryQueue.length === 0 ? (
                                <>
                                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="trophy" className="w-10 h-10 text-green-600"/></div>
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2">太棒了！全部掌握</h3>
                                    <button onClick={onClose} className="px-6 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">退出复习</button>
                                </>
                            ) : (
                                <>
                                    <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="rotate-cw" className="w-10 h-10 text-amber-600"/></div>
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2">本轮结束</h3>
                                    <p className="text-gray-500 mb-6">还有 <span className="font-bold text-amber-600">{retryQueue.length}</span> 张卡片需要加强记忆。</p>
                                    <button onClick={onRetry} className="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/30">开始第 {round + 1} 轮攻坚</button>
                                </>
                            )}
                        </div>
                    ) : (
                        <>
                            <div className="relative w-full max-w-2xl aspect-[3/2] cursor-pointer perspective-1000 group" onClick={() => setIsFlipped(!isFlipped)}>
                                <div className={`w-full h-full relative transform-style-3d transition-transform duration-500 ${isFlipped ? 'rotate-y-180' : ''}`}>
                                    <div className="absolute inset-0 backface-hidden bg-white rounded-2xl shadow-2xl flex flex-col items-center justify-center p-12 border-b-8 border-blue-500">
                                        <span className="text-sm font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full mb-4">{current.category} · {current.type}</span>
                                        <h3 className="text-3xl font-bold text-gray-800 text-center leading-tight">{current.title}</h3>
                                        <p className="mt-8 text-gray-400 text-sm animate-pulse flex items-center gap-1"><Icon name="flip-horizontal" className="w-4 h-4"/> 点击翻转查看详情</p>
                                    </div>
                                    <div className="absolute inset-0 backface-hidden rotate-y-180 bg-slate-50 rounded-2xl shadow-2xl flex flex-col p-8 border-b-8 border-green-500 overflow-hidden text-left cursor-default" onClick={e => e.stopPropagation()}>
                                        <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                            <h4 className="font-bold text-blue-600 text-xs uppercase mb-2 tracking-wider">定理内容</h4>
                                            <div className="mb-6 text-base text-gray-800"><MathRenderer content={current.content} /></div>
                                            <h4 className="font-bold text-green-600 text-xs uppercase mb-2 tracking-wider border-t border-gray-200 pt-4">证明过程</h4>
                                            {current.proof ? <div className="text-sm text-gray-600 leading-relaxed"><MathRenderer content={current.proof} /></div> : <div className="text-sm text-gray-400 italic bg-gray-100 p-3 rounded">暂无证明，建议在主界面生成。</div>}
                                        </div>
                                        <div className="mt-4 pt-2 border-t border-gray-200 flex justify-center"><button onClick={() => setIsFlipped(false)} className="text-sm text-gray-400 hover:text-gray-600 flex items-center gap-1"><Icon name="rotate-ccw" className="w-3 h-3"/> 翻回正面</button></div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-6 mt-10">
                                <button onClick={() => onResult(false)} className="px-8 py-3 rounded-xl bg-red-500/20 text-red-200 border border-red-500/50 hover:bg-red-500 hover:text-white transition font-bold flex items-center gap-2 backdrop-blur-sm"><Icon name="x" className="w-5 h-5"/> 未掌握</button>
                                <button onClick={() => onResult(true)} className="px-8 py-3 rounded-xl bg-green-500/20 text-green-200 border border-green-500/50 hover:bg-green-500 hover:text-white transition font-bold flex items-center gap-2 backdrop-blur-sm"><Icon name="check" className="w-5 h-5"/> 已掌握</button>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const DetailModal = ({ item, onClose, showProof, setShowProof, isLoading, activeTool, isToolLoading, isChatLoading, onGenerateProof, onAiTool, onSendChat }) => {
            if (!item) return null;
            const [chatInput, setChatInput] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => {
                if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }, [item.chatHistory, isChatLoading]);

            const handleSend = () => {
                if(!chatInput.trim()) return;
                onSendChat(chatInput);
                setChatInput('');
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-4xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200">
                        {/* Header */}
                        <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={onClose} className="flex items-center gap-1 px-3 py-1.5 hover:bg-gray-200 rounded-lg text-gray-600 transition-colors text-sm font-bold">
                                    <Icon name="arrow-left" className="w-5 h-5"/> 返回
                                </button>
                                <div className="h-6 w-px bg-gray-300"></div>
                                <div>
                                    <div className="flex items-center gap-2 mb-0.5">
                                        <span className="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700 border border-blue-200">{item.category}</span>
                                        <span className="text-xs text-gray-500 font-medium">{item.type}</span>
                                    </div>
                                    <h2 className="text-xl font-bold text-gray-900 line-clamp-1">{item.title}</h2>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full text-gray-400 hover:text-gray-600"><Icon name="x" className="w-6 h-6"/></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-8 space-y-8 scroll-smooth bg-white">
                            <div className="bg-blue-50/50 p-6 rounded-xl border border-blue-100 shadow-sm">
                                <h3 className="text-sm font-bold text-blue-800 uppercase tracking-wide mb-3 flex items-center gap-2"><Icon name="align-left" className="w-4 h-4"/> 内容陈述</h3>
                                <div className="text-lg text-gray-800 leading-relaxed"><MathRenderer content={item.content} /></div>
                            </div>
                            <div className="border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                <div className="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                                    <h3 className="font-bold text-gray-700 flex items-center gap-2"><Icon name="pen-tool" className="w-4 h-4"/> 完整证明</h3>
                                    {!item.proof ? <button onClick={() => onGenerateProof(item)} disabled={isLoading} className="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700 flex items-center gap-2 shadow-sm">{isLoading ? '...' : <><Icon name="wand-2" className="w-3 h-3"/> AI 补全</>}</button> : <button onClick={() => setShowProof(!showProof)} className="px-3 py-1.5 bg-white border border-gray-300 text-gray-700 text-sm rounded-lg hover:bg-gray-50 flex items-center gap-2">{showProof ? <Icon name="eye-off" className="w-3 h-3"/> : <Icon name="eye" className="w-3 h-3"/>} {showProof ? '隐藏' : '查看'}</button>}
                                </div>

                                    {isToolLoading ? <div className="text-center py-4 text-green-600"><div className="spinner w-5 h-5 border-green-600 border-l-transparent mx-auto mb-2"></div>R1 思考中...</div> : (activeTool && item.aiTools?.[activeTool] && <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm tool-result"><MathRenderer content={item.aiTools[activeTool]} /></div>)}
                                </div>

                                    <button onClick={handleSend} disabled={isChatLoading} className="px-6 py-2 bg-purple-600 text-white rounded-lg text-sm font-bold hover:bg-purple-700 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"><Icon name="send" className="w-4 h-4"/> 发送</button>

        const Sidebar = ({ isDragging, fileInputRef, inputText, setInputText, onProcessFile, onExtract, isLoading }) => (
            <div className={`w-1/4 min-w-[280px] flex flex-col border-r border-gray-200 bg-white h-screen ${isDragging ? 'bg-blue-50' : ''}`}>
                <div className="p-4 border-b border-gray-200 bg-gradient-to-r from-blue-50 to-white">
                    <h2 className="font-bold text-lg text-blue-900 flex items-center gap-2"><Icon name="brain-circuit" className="w-5 h-5"/> MathMind Pro</h2>
                    <p className="text-xs text-blue-600 mt-1">OCR 识别 + 深度推理 + 知识图谱</p>
                </div>
                <div className="flex-1 p-4 flex flex-col relative overflow-y-auto">
                    {isDragging && <div className="absolute inset-0 z-50 bg-blue-100/90 flex items-center justify-center text-blue-600 font-bold border-2 border-dashed border-blue-500 m-2 rounded-xl">松手解析</div>}
                    <div className="mb-3 flex justify-between items-center text-xs text-gray-500">
                        <span>输入资料</span>
                        <span className="bg-gray-100 px-2 py-1 rounded">支持 Ctrl+V 粘贴/拖拽</span>

                        <Icon name="upload-cloud" className="w-4 h-4"/> 上传 PDF / 图片
                    </button>
                    <textarea className="flex-1 w-full p-3 border border-gray-300 rounded-lg text-xs font-mono resize-none focus:ring-2 focus:ring-blue-500" placeholder="识别内容将显示在此..." value={inputText} onChange={(e)=>setInputText(e.target.value)}></textarea>
                    <button onClick={onExtract} disabled={isLoading||!inputText} className="mt-3 w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold flex items-center justify-center gap-2 transition disabled:bg-gray-400">
                        {isLoading ? <div className="spinner border-white/30 border-l-white"></div> : <Icon name="sparkles" className="w-4 h-4"/>} 
                        {isLoading ? 'AI 处理中...' : '提取知识点'}

        );

        const GraphView = ({ knowledgeBase, graphData, isGraphGenerating, generateGraph, setSelectedItem, setShowProof, setActiveTool }) => {
            if (Object.keys(knowledgeBase).length === 0) return <div className="flex-1 flex flex-col items-center justify-center text-gray-400"><Icon name="share-2" className="w-16 h-16 mb-4 opacity-20"/><p>请先提取知识点以生成图谱</p></div>;
            
            // 布局配置
            const width = 800;
            const height = 600;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 80;

            const nodesWithPos = useMemo(() => {
                const count = graphData.nodes.length;
                return graphData.nodes.map((node, i) => {
                    const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
                    return {
                        ...node,
                        x: centerX + Math.cos(angle) * radius,
                        y: centerY + Math.sin(angle) * radius
                    };
                });
            }, [graphData]);

            return (
                <div className="flex-1 p-6 overflow-hidden flex flex-col h-full">
                    <div className="flex justify-between items-center mb-6">
                        <div><h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Icon name="share-2" className="text-purple-500 w-6 h-6"/> 知识图谱</h2><p className="text-sm text-gray-500">可视化定理间的推导与依赖关系</p></div>
                        <button onClick={generateGraph} disabled={isGraphGenerating} className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 flex items-center gap-2">{isGraphGenerating ? '分析中...' : <><Icon name="refresh-cw" className="w-4 h-4"/> 生成/刷新图谱</>}</button>
                    </div>
                    <div className="flex-1 bg-white rounded-2xl border border-gray-200 shadow-inner relative overflow-hidden flex items-center justify-center">
                        {graphData.nodes.length === 0 ? <p className="text-gray-400">点击右上角按钮开始分析知识结构</p> : 
                            <svg className="w-full h-full" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
                                <defs>
                                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="28" refY="3.5" orient="auto">
                                        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                                    </marker>
                                </defs>
                                {graphData.links.map((link, i) => {
                                    const source = nodesWithPos.find(n => n.id === link.source);
                                    const target = nodesWithPos.find(n => n.id === link.target);
                                    if (!source || !target) return null;
                                    const midX = (source.x + target.x) / 2;
                                    const midY = (source.y + target.y) / 2;
                                    return (
                                        <g key={`link-${i}`} className="group">
                                            <line x1={source.x} y1={source.y} x2={target.x} y2={target.y} className="link-line group-hover:stroke-blue-400 group-hover:stroke-2" stroke="#cbd5e1" strokeWidth="1.5" markerEnd="url(#arrowhead)" />
                                            <rect x={midX - 20} y={midY - 9} width="40" height="18" rx="4" fill="white" fillOpacity="0.9" className="group-hover:fill-blue-50"/>
                                            <text x={midX} y={midY + 4} textAnchor="middle" className="text-[10px] fill-gray-500 font-medium group-hover:fill-blue-600 pointer-events-none">{link.type || '关联'}</text>
                                        </g>
                                    );
                                })}
                                {nodesWithPos.map((node, i) => (
                                    <g key={`node-${i}`} className="cursor-pointer group transition-all duration-300" onClick={() => {
                                            const allItems = Object.values(knowledgeBase).flat();
                                            let item = allItems[node.id] || allItems.find(it => it.title === node.label);
                                            if (item) { setSelectedItem(item); setShowProof(false); setActiveTool(null); }
                                            else { alert("未找到该节点对应的详细内容"); }
                                        }}>
                                        <circle cx={node.x} cy={node.y} r="22" fill={node.group === '定理' ? '#eff6ff' : '#f0fdf4'} stroke={node.group === '定理' ? '#3b82f6' : '#22c55e'} strokeWidth="2" className="transition-all duration-300 group-hover:r-26 group-hover:stroke-[3px] shadow-lg"/>
                                        <text x={node.x} y={node.y + 4} textAnchor="middle" className={`text-[10px] font-bold pointer-events-none ${node.group === '定理' ? 'fill-blue-600' : 'fill-green-600'}`}>{i + 1}</text>
                                        <text x={node.x} y={node.y + 40} textAnchor="middle" className="text-[12px] fill-gray-700 font-bold select-none group-hover:fill-black group-hover:text-[13px] transition-all" style={{textShadow: '0 2px 4px rgba(255,255,255,0.9)'}}>{node.label}</text>
                                    </g>
                                ))}
                            </svg>
                        }
                    </div>
                </div>
            );
        };

        const ExamView = ({ knowledgeBase, examPaper, isExamGenerating, generateExam, setSelectedItem }) => {
            if (Object.keys(knowledgeBase).length === 0) return <div className="flex-1 flex flex-col items-center justify-center text-gray-400"><Icon name="graduation-cap" className="w-16 h-16 mb-4 opacity-20"/><p>请先提取知识点以生成试卷</p></div>;
            return (
                <div className="flex-1 p-6 overflow-hidden flex flex-col h-full scroll-smooth">
                    <div className="flex justify-between items-center mb-6">
                        <div><h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Icon name="graduation-cap" className="text-orange-500 w-6 h-6"/> 智能模拟考</h2><p className="text-sm text-gray-500">基于你的笔记库自动生成针对性试题</p></div>
                        <button onClick={generateExam} disabled={isExamGenerating} className="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 disabled:opacity-50 flex items-center gap-2">{isExamGenerating ? '出题中...' : <><Icon name="plus-circle" className="w-4 h-4"/> 生成新试卷</>}</button>
                    </div>
                    <div className="flex-1 overflow-y-auto">
                        {!examPaper ? <div className="h-full flex flex-col items-center justify-center text-gray-400 border-2 border-dashed border-gray-200 rounded-2xl"><p>点击上方按钮，AI 考官将为你出题</p></div> : 
                            <div className="max-w-3xl mx-auto space-y-8 pb-10">
                                <div className="text-center border-b border-gray-200 pb-4 mb-8"><h1 className="text-3xl font-serif font-bold text-gray-900">{examPaper.title}</h1><p className="text-gray-500 mt-2">考试时间：30分钟 | 总分：100分</p></div>
                                {examPaper.questions.map((q, idx) => (
                                    <div key={idx} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                        <div className="flex justify-between items-start mb-4"><span className="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold">第 {idx + 1} 题 · {q.type}</span></div>
                                        <div className="text-lg text-gray-800 mb-6 font-medium"><MathRenderer content={q.q} /></div>
                                        <details className="group">
                                            <summary className="flex items-center gap-2 text-sm font-bold text-blue-600 cursor-pointer select-none hover:text-blue-800">
                                                <span>查看参考答案</span>
                                                <Icon name="chevron-down" className="w-4 h-4 transition-transform group-open:rotate-180"/>
                                            </summary>
                                            <div className="mt-4 p-4 bg-blue-50/50 rounded-lg border border-blue-100 text-gray-700 animate-in slide-in-from-top-2">
                                                <MathRenderer content={q.a} />
                                                <div className="mt-4 border-t border-blue-200 pt-3 flex justify-end">
                                                    <button onClick={() => { setSelectedItem({ id: `exam-${Date.now()}-${idx}`, category: '模拟考', type: '习题错题本', title: `模拟题 - 第${idx+1}题`, content: `**题目**：\n${q.q}\n\n**参考答案**：\n${q.a}`, proof: null, chatHistory: [], hints: [] }); }} className="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1 font-bold">
                                                        <Icon name="message-circle" className="w-4 h-4" /> 没看懂？问 AI 老师
                                                    </button>
                                                </div>
                                            </div>
                                        </details>
                                    </div>
                                ))}
                            </div>
                        }
                    </div>
                </div>
            );
        };

        const App = () => {
            // --- State: DeepSeek & Vision ---
            const [deepseekKey, setDeepseekKey] = useState('');
            const [visionKey, setVisionKey] = useState('');
            const [visionModel, setVisionModel] = useState(''); 
            const [visionBaseUrl, setVisionBaseUrl] = useState('https://ark.cn-beijing.volces.com/api/v3');

            // --- UI State ---
            const [showSettings, setShowSettings] = useState(false);
            const [activeTab, setActiveTab] = useState('library'); 
            const [inputText, setInputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [loadingMessage, setLoadingMessage] = useState('');
            const [usePreprocess, setUsePreprocess] = useState(true);
            
            // --- Data ---
            const [knowledgeBase, setKnowledgeBase] = useState({});
            const [selectedItem, setSelectedItem] = useState(null); 
            const [showProof, setShowProof] = useState(false);
            
            // --- Feature State ---
            const [isChatLoading, setIsChatLoading] = useState(false);
            const [activeTool, setActiveTool] = useState(null);
            const [isToolLoading, setIsToolLoading] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            
            // --- Flashcard State ---
            const [showFlashcards, setShowFlashcards] = useState(false);
            const [flashcardQueue, setFlashcardQueue] = useState([]);
            const [retryQueue, setRetryQueue] = useState([]); 
            const [currentCardIdx, setCurrentCardIdx] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [roundCount, setRoundCount] = useState(1);

            // --- Graph State ---
            const [graphData, setGraphData] = useState({ nodes: [], links: [] });
            const [isGraphGenerating, setIsGraphGenerating] = useState(false);

            // --- Exam State ---
            const [examPaper, setExamPaper] = useState(null);
            const [isExamGenerating, setIsExamGenerating] = useState(false);
            
            // Refs
            const fileInputRef = useRef(null);

            // --- API Helpers ---
            const cleanApiKey = (key) => key ? key.trim().replace(/[^\x00-\x7F]/g, "").replace(/[\u0000-\u001F\u007F-\u009F]/g, "") : "";
            const extractJsonFromResponse = (text) => {
                const jsonMatch = text.match(/```json\n([\s\S]*?)\n```/) || text.match(/\{[\s\S]*\}/);
                return jsonMatch ? (jsonMatch[1] || jsonMatch[0]) : text;
            };

            const callDeepSeek = async (systemPrompt, userPrompt) => {
                if (!deepseekKey) { alert("请先设置 DeepSeek API Key"); setShowSettings(true); return null; }
                const cleanKey = cleanApiKey(deepseekKey);
                try {
                    const response = await fetch(`https://api.deepseek.com/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanKey}` },
                        body: JSON.stringify({
                            model: "deepseek-reasoner",
                            messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }],
                            temperature: 0.6
                        })
                    });
                    if (!response.ok) throw new Error((await response.json()).error?.message || response.status);
                    return (await response.json()).choices[0].message.content;
                } catch (error) {
                    console.error(error); alert(`DeepSeek 请求失败: ${error.message}`); return null;
                }
            };

            const callVisionAPI = async (base64Image) => {
                const cleanKey = cleanApiKey(visionKey);
                if (!cleanKey) throw new Error("未配置 Vision API Key");
                if (!visionModel) throw new Error("未配置模型 Endpoint ID");
                const response = await fetch(`${visionBaseUrl.replace(/\/+$/, '')}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanKey}` },
                    body: JSON.stringify({
                        model: visionModel, 
                        messages: [{ role: "user", content: [{ type: "text", text: "请精准识别内容，数学公式转为LaTeX，文字转为中文。" }, { type: "image_url", image_url: { url: base64Image } }] }]
                    })
                });
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    if (response.status === 404) throw new Error(`404 错误: Endpoint ID 错误。`);
                    if (response.status === 400 && base64Image.startsWith('data:application/pdf')) throw new Error(`400 错误: 模型不支持 PDF。`);
                    throw new Error(`Vision API Error: ${response.status} ${errData.error?.message || ''}`);
                }
                const data = await response.json();
                return data.choices[0].message.content;
            };

            // --- File Processing ---
            const preprocessImage = (file) => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const scaleFactor = 2.0; canvas.width = img.width * scaleFactor; canvas.height = img.height * scaleFactor;
                    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        const newVal = avg < 170 ? 0 : 255;
                        data[i] = data[i + 1] = data[i + 2] = newVal;
                    }
                    ctx.putImageData(imgData, 0, 0);
                    
                    resolve(canvas.toDataURL('image/png')); 
                }; img.src = URL.createObjectURL(file);
            });
            const renderPageToImage = async (pdf, pageNum) => {
                const page = await pdf.getPage(pageNum); const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas'); const context = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise; return canvas.toDataURL('image/jpeg', 0.8);
            };
            const handleImageOCR = async (file) => {
                if (visionKey) {
                    setIsLoading(true); setLoadingMessage(`视觉模型正在识别...`);
                    try {
                        const reader = new FileReader(); reader.readAsDataURL(file);
                        reader.onload = async () => {
                            try { const text = await callVisionAPI(reader.result); setInputText(prev => (prev ? prev + "\n\n" : "") + `--- Vision OCR ---\n${text}`); }
                            catch (err) { if(confirm(`视觉模型失败: ${err.message}\n使用本地引擎？`)) fallbackTesseract(file); }
                            finally { setIsLoading(false); setLoadingMessage(''); if(fileInputRef.current) fileInputRef.current.value = ''; }
                        };
                    } catch (error) { fallbackTesseract(file); } return;
                } fallbackTesseract(file);
            };
            const fallbackTesseract = async (file) => {
                setIsLoading(true); setLoadingMessage('本地引擎识别中...');
                try {
                    let imageSource = file; if (usePreprocess) imageSource = await preprocessImage(file);
                    const worker = await Tesseract.createWorker(); await worker.loadLanguage('chi_sim+eng'); await worker.initialize('chi_sim+eng');
                    const { data: { text } } = await worker.recognize(imageSource); await worker.terminate();
                    if (!text.trim()) alert('未能识别。'); else setInputText(prev => (prev ? prev + "\n\n" : "") + `--- Local OCR ---\n${text}`);
                } catch (error) { alert("OCR 失败"); } finally { setIsLoading(false); setLoadingMessage(''); }
            };
            const handlePdfParse = async (file) => {
                setIsLoading(true);
                if (visionKey && visionModel) {
                    try {
                        setLoadingMessage('读取 PDF...'); const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                        if (pdf.numPages > 3 && !confirm(`共 ${pdf.numPages} 页，视觉模型耗时较长。是否继续？`)) { fallbackPdfTextExtract(pdf); return; }
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            setLoadingMessage(`视觉模型识别第 ${i}/${pdf.numPages} 页...`);
                            fullText += `\n--- Page ${i} ---\n${await callVisionAPI(await renderPageToImage(pdf, i))}\n`;
                        }
                        setInputText(prev => (prev ? prev + "\n\n" : "") + fullText); setIsLoading(false); setLoadingMessage(''); return;
                    } catch (err) { alert(`Vision 失败: ${err.message}，切换本地模式`); fallbackPdfTextExtract(await pdfjsLib.getDocument(await file.arrayBuffer()).promise); return; }
                }
                try { fallbackPdfTextExtract(await pdfjsLib.getDocument(await file.arrayBuffer()).promise); } catch(e) { alert("PDF 失败"); setIsLoading(false); }
            };
            const fallbackPdfTextExtract = async (pdf) => {
                setLoadingMessage('提取文本...'); let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) { fullText += `\n--- P${i} ---\n${(await (await pdf.getPage(i)).getTextContent()).items.map(i=>i.str).join(' ')}\n`; }
                setInputText(prev => (prev ? prev + "\n\n" : "") + fullText); setIsLoading(false); setLoadingMessage('');
            };
            const processFile = (file) => { if (file.type === 'application/pdf') handlePdfParse(file); else handleImageOCR(file); };

            useEffect(() => {
                const handlePaste = (e) => {
                    if (e.clipboardData?.items) {
                        for (let item of e.clipboardData.items) {
                            if (item.kind === 'file') { e.preventDefault(); processFile(item.getAsFile()); }
                        }
                    }
                };
                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, [visionKey, visionModel, usePreprocess]);

            // --- Handlers ---
            const handleExtract = async () => {
                if (!inputText.trim()) return;
                setIsLoading(true); setLoadingMessage("R1 正在结构化提取...");
                const res = await callDeepSeek(`你是一个数学家助手。修复OCR错误并提取内容。JSON格式：{ "items": [{ "category": "String", "type": "String", "title": "String", "content": "String (LaTeX)", "proof": "String|null", "tags": ["String"] }] }`, inputText);
                if (res) {
                    try {
                        const parsed = JSON.parse(extractJsonFromResponse(res));
                        const newKB = { ...knowledgeBase };
                        parsed.items.forEach(item => {
                            if (!newKB[item.category]) newKB[item.category] = [];
                            newKB[item.category].push({ ...item, id: Date.now() + Math.random(), hints: [], chatHistory: [], aiTools: {} });
                        });
                        setKnowledgeBase(newKB); setInputText('');
                    } catch (e) { alert("解析失败"); }
                } setIsLoading(false); setLoadingMessage('');
            };
            
            const handleGenerateProof = async (item) => {
                setIsLoading(true); setLoadingMessage("R1 正在推导...");
                const res = await callDeepSeek(`用中文提供证明。JSON：{ "proof": "LaTeX", "hints": ["..."] }`, `定理：${item.title}\n${item.content}`);
                if (res) { try { const p = JSON.parse(extractJsonFromResponse(res)); updateItem({ ...item, proof: p.proof, hints: p.hints }); } catch(e){} }
                setIsLoading(false); setShowProof(true);
            };

            const handleAiTool = async (type) => {
                if (!selectedItem || selectedItem.aiTools?.[type]) { setActiveTool(type); return; }
                setActiveTool(type); setIsToolLoading(true);
                const prompts = { feynman: "费曼技巧通俗解释(中文)", pitfalls: "列出3个易错点(中文)", quiz: "出一道题并附带思路(中文)" };
                const res = await callDeepSeek(prompts[type], selectedItem.content);
                if (res) updateItem({ ...selectedItem, aiTools: { ...selectedItem.aiTools, [type]: res } });
                setIsToolLoading(false);
            };

            const handleSendChat = async (message) => {
                if (!message || !selectedItem) return;
                const newItem = { ...selectedItem, chatHistory: [...selectedItem.chatHistory, { role: 'user', content: message }] };
                updateItem(newItem); setIsChatLoading(true);
                const history = newItem.chatHistory.map(m => `${m.role==='user'?'生':'师'}:${m.content}`).join('\n');
                const res = await callDeepSeek(`中文回答。基于：${newItem.title}\n${newItem.content}\n证明：${newItem.proof}`, `历史：\n${history}\n\n回答：`);
                if (res) updateItem({ ...newItem, chatHistory: [...newItem.chatHistory, { role: 'assistant', content: res }] });
                setIsChatLoading(false);
            };

            const updateItem = (item) => {
                const newKB = { ...knowledgeBase }; const list = newKB[item.category];
                const idx = list.findIndex(i => i.id === item.id); if (idx !== -1) { list[idx] = item; setKnowledgeBase(newKB); setSelectedItem(item); }
            };

            const handleExportTex = () => {
                let content = `\\documentclass{article}\n\\usepackage{amsmath,amssymb,amsthm}\n\\usepackage[utf8]{inputenc}\n\\usepackage{xeCJK}\n\\begin{document}\n`;
                Object.values(knowledgeBase).flat().forEach(i => content += `\\paragraph{${i.title}}\n${i.content}\n${i.proof ? `\\begin{proof}${i.proof}\\end{proof}` : ''}\n`);
                content += `\\end{document}`;
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([content], {type: 'text/plain'}));
                a.download = 'math_review.tex'; a.click();
            };

            const generateGraph = async () => {
                const allItems = Object.values(knowledgeBase).flat();
                if (allItems.length === 0) return;
                setIsGraphGenerating(true);
                const summary = allItems.map((item, idx) => `${idx}. [${item.type}] ${item.title}`).join('\n');
                const prompt = `你是一个数学知识图谱构建者。请分析依赖关系。返回JSON：{ "nodes": [{"id":0,"label":"Title","group":"Category"}], "links": [{"source":0,"target":1,"type":"dependency"}] }。输入：\n${summary}`;
                const res = await callDeepSeek(prompt, "开始构建图谱");
                if (res) { try { setGraphData(JSON.parse(extractJsonFromResponse(res))); } catch (e) { console.error(e); alert("图谱失败"); } }
                setIsGraphGenerating(false);
            };

            const generateExam = async () => {
                const allItems = Object.values(knowledgeBase).flat();
                if (allItems.length === 0) return;
                setIsExamGenerating(true);
                const context = allItems.map(i => `${i.type}: ${i.title}\n${i.content}`).join('\n---\n');
                const prompt = `出3道模拟题（填空/计算/证明）。JSON：{ "title": "...", "questions": [{ "type": "...", "q": "LaTeX", "a": "LaTeX" }] }。资料：\n${context.slice(0, 3000)}`;
                const res = await callDeepSeek(prompt, "生成试卷");
                if (res) { try { setExamPaper(JSON.parse(extractJsonFromResponse(res))); } catch (e) { console.error(e); alert("试卷失败"); } }
                setIsExamGenerating(false);
            };

            const startFlashcards = () => {
                const allItems = Object.values(knowledgeBase).flat();
                if (allItems.length === 0) return;
                setFlashcardQueue(allItems); setRetryQueue([]); setCurrentCardIdx(0); setRoundCount(1); setIsFlipped(false); setShowFlashcards(true);
            };
            const handleCardResult = (mastered) => {
                if (!mastered) setRetryQueue(prev => [...prev, flashcardQueue[currentCardIdx]]);
                setIsFlipped(false); setTimeout(() => setCurrentCardIdx(prev => prev + 1), 200);
            };
            const startRetryRound = () => {
                setFlashcardQueue(retryQueue); setRetryQueue([]); setCurrentCardIdx(0); setRoundCount(prev => prev + 1); setIsFlipped(false);
            };

            // --- Main Layout ---
            return (
                <div className="flex h-screen overflow-hidden" onDragEnter={(e)=>{e.preventDefault();setIsDragging(true)}} onDragOver={(e)=>e.preventDefault()} onDrop={(e)=>{e.preventDefault();setIsDragging(false);processFile(e.dataTransfer.files[0])}}>
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center">
                            <div className="bg-white p-6 rounded-xl shadow-2xl w-[32rem]">
                                <h3 className="text-xl font-bold mb-4">API 设置</h3>
                                <div className="space-y-4">
                                    <div><label className="text-xs font-bold text-gray-500">DeepSeek Key</label><input type="password" value={deepseekKey} onChange={e=>setDeepseekKey(e.target.value)} className="w-full p-2 border rounded" placeholder="sk-..." /></div>
                                    <div className="border-t pt-4">
                                        <label className="text-xs font-bold text-gray-500">Vision Key (OCR)</label><input type="password" value={visionKey} onChange={e=>setVisionKey(e.target.value)} className="w-full p-2 border rounded mb-2" placeholder="sk-..." />
                                        <label className="text-xs font-bold text-gray-500">Endpoint ID</label><input type="text" value={visionModel} onChange={e=>setVisionModel(e.target.value)} className="w-full p-2 border rounded" placeholder="ep-..." />
                                    </div>
                                </div>
                                <button onClick={()=>setShowSettings(false)} className="w-full mt-6 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">保存</button>
                            </div>
                        </div>
                    )}

                    <FlashcardModal 
                        show={showFlashcards}
                        queue={flashcardQueue}
                        retryQueue={retryQueue}
                        round={roundCount}
                        currentIndex={currentCardIdx}
                        isFlipped={isFlipped}
                        setIsFlipped={setIsFlipped}
                        onClose={() => setShowFlashcards(false)}
                        onResult={handleCardResult}
                        onRetry={startRetryRound}
                    />
                    
                    <DetailModal 
                        item={selectedItem} 
                        onClose={() => setSelectedItem(null)}
                        showProof={showProof}
                        setShowProof={setShowProof}
                        isLoading={isLoading}
                        activeTool={activeTool}
                        isToolLoading={isToolLoading}
                        isChatLoading={isChatLoading}
                        onGenerateProof={handleGenerateProof}
                        onAiTool={handleAiTool}
                        onSendChat={handleSendChat}
                    />

                    <Sidebar 
                        isDragging={isDragging}
                        fileInputRef={fileInputRef}
                        inputText={inputText}
                        setInputText={setInputText}
                        onProcessFile={processFile}
                        onExtract={handleExtract}
                        isLoading={isLoading}
                    />

                    <div className="flex-1 flex flex-col bg-gray-50 h-screen relative">
                        <header className="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm z-10 shrink-0">
                            <div className="flex gap-1 bg-gray-100 p-1 rounded-lg">
                                {[{id: 'library', icon: 'library', label: '知识库'}, {id: 'graph', icon: 'share-2', label: '知识图谱'}, {id: 'exam', icon: 'graduation-cap', label: '模拟考'}].map(tab => (
                                    <button key={tab.id} onClick={()=>setActiveTab(tab.id)} className={`px-4 py-2 rounded-md text-sm font-bold flex items-center gap-2 transition-all ${activeTab === tab.id ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>
                                        <Icon name={tab.icon} className="w-4 h-4"/> {tab.label}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="flex gap-3">
                                <button onClick={startFlashcards} disabled={Object.keys(knowledgeBase).length===0} className="px-3 py-2 bg-green-50 text-green-700 rounded-lg text-sm font-bold border border-green-200 hover:bg-green-100 transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <Icon name="layers" className="w-4 h-4"/> 闪卡
                                </button>
                                <button onClick={handleExportTex} disabled={Object.keys(knowledgeBase).length===0} className="px-3 py-2 bg-white text-gray-700 rounded-lg text-sm font-bold border border-gray-200 hover:bg-gray-50 transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <Icon name="download" className="w-4 h-4"/> 导出 TeX
                                </button>
                                <button onClick={()=>setShowSettings(true)} className="p-2 text-gray-500 hover:bg-gray-100 rounded-lg transition relative" title="设置 API">
                                    <Icon name="settings" className="w-5 h-5"/>
                                    {(!deepseekKey||!visionKey)&&<span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}
                                </button>
                            </div>
                        </header>

                        {activeTab === 'library' && (
                            <div className="flex-1 overflow-y-auto p-8 scroll-smooth">
                                {Object.keys(knowledgeBase).length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-400 select-none">
                                        <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-sm border border-gray-100"><Icon name="book-open" className="w-10 h-10 opacity-20"/></div>
                                        <h3 className="text-lg font-bold text-gray-500 mb-2">开始你的复习</h3>
                                        <p className="text-sm">上传资料 -> 提取知识 -> 图谱分析 -> 模拟考试</p>
                                    </div>
                                ) : (
                                    Object.entries(knowledgeBase).map(([category, items]) => (
                                        <div key={category} className="mb-8">
                                            <h3 className="text-lg font-bold text-gray-800 border-l-4 border-blue-500 pl-3 mb-4 flex items-center"><Icon name="folder-open" className="w-5 h-5 mr-2 text-blue-500"/> {category} <span className="ml-2 text-xs font-normal text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">{items.length}</span></h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {items.map(item => (
                                                    <div key={item.id} onClick={() => { setSelectedItem(item); setShowProof(false); setActiveTool(null); }} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <span className={`text-[10px] font-bold px-2 py-1 rounded ${item.type === '定义' ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}`}>{item.type}</span>
                                                            {item.proof ? <Icon name="check-circle-2" className="w-4 h-4 text-green-500"/> : <Icon name="circle-dashed" className="w-4 h-4 text-amber-400"/>}
                                                        </div>
                                                        <h4 className="font-bold text-gray-800 mb-2 line-clamp-1">{item.title}</h4>
                                                        <div className="text-xs text-gray-500 line-clamp-2"><MathRenderer content={item.content} /></div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {activeTab === 'graph' && <GraphView 
                            knowledgeBase={knowledgeBase} 
                            graphData={graphData} 
                            isGraphGenerating={isGraphGenerating} 
                            generateGraph={generateGraph} 
                            setSelectedItem={setSelectedItem} 
                            setShowProof={setShowProof} 
                            setActiveTool={setActiveTool} 
                        />}
                        {activeTab === 'exam' && <ExamView 
                            knowledgeBase={knowledgeBase} 
                            examPaper={examPaper} 
                            isExamGenerating={isExamGenerating} 
                            generateExam={generateExam} 
                            setSelectedItem={setSelectedItem} 
                        />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
